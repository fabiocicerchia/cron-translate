[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-translate"
version = "0.3.0"
description = "cron expressions <-> plain language <-> timezone-aware next runs, with DST warnings"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["croniter>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2", "basedpyright>=1.31"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/cron-translate"
Issues = "https://github.com/fabiocicerchia/cron-translate/issues"
Changelog = "https://github.com/fabiocicerchia/cron-translate/blob/main/CHANGELOG.md"

[project.scripts]
cron-translate = "cron_translate:main"

[tool.setuptools]
py-modules = ["cron_translate"]

[tool.pytest.ini_options]
# Without this, pytest inserts tests/ on sys.path and `import cron_translate`
# resolves to an installed copy in site-packages instead of this checkout.
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
]

[tool.basedpyright]
# FC-PY-003 asks for strict. The point of a type checker in CI is that it knows
# the types: "unknown" is the finding, not a level of detail to relax away.
typeCheckingMode = "strict"
# Matches requires-python, so the checker rejects what the oldest supported
# interpreter would reject rather than what this machine happens to run.
pythonVersion = "3.10"
# Third-party stubs are not this repository's to ship, and a missing one is a
# packaging fact about someone else's project rather than a defect here.
reportMissingTypeStubs = false

# The man page rides along in the wheel: `pip install` puts it under
# <prefix>/share/man/man1, which is on the default manpath for a system install
# and for a --user one alike.
[tool.setuptools.data-files]
"share/man/man1" = ["man/cron-translate.1"]
