[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-translate"
version = "0.2.2"
description = "cron expressions <-> plain language <-> timezone-aware next runs, with DST warnings"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = ["croniter>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/cron-translate"
Issues = "https://github.com/fabiocicerchia/cron-translate/issues"
Changelog = "https://github.com/fabiocicerchia/cron-translate/blob/main/CHANGELOG.md"

[project.scripts]
cron-translate = "cron_translate:main"

[tool.setuptools]
py-modules = ["cron_translate"]

[tool.pytest.ini_options]
# Without this, pytest inserts tests/ on sys.path and `import cron_translate`
# resolves to an installed copy in site-packages instead of this checkout.
pythonpath = ["."]

[tool.ruff]
line-length = 100
