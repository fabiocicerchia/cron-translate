name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # TRIAL: the docs claim a job killed by timeout-minutes never records,
    # because the runner stops without reaching the post step. Never verified.
    # sleep 180 against a 1-minute budget forces the kill.
    timeout-minutes: 1
    steps:
      # TRIAL: measuring this job's own energy. Pinned to the PR branch
      # because nothing is released yet. Its post step runs at job end.
      - uses: fabiocicerchia/carbon-badge/record@feat/self-reported-measurement
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # TRIAL: long enough to cancel mid-flight. The question is whether the
      # recorder's post step still runs when a job is cancelled — the entire
      # reason it is a JS action rather than an `if: always()` step.
      - name: Sleep so this job can be cancelled
        run: sleep 180
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # TRIAL: measuring this job's own energy. Pinned to the PR branch
      # because nothing is released yet. Its post step runs at job end.
      - uses: fabiocicerchia/carbon-badge/record@feat/self-reported-measurement
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      # TRIAL: measuring this job's own energy. Pinned to the PR branch
      # because nothing is released yet. Its post step runs at job end.
      - uses: fabiocicerchia/carbon-badge/record@feat/self-reported-measurement
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Check metadata
        run: pip install twine && twine check dist/*
