name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # TRIAL: can a hosted runner see which Azure region it is in? IMDS is a
      # link-local address, so no third party, no key, no rate limit — unlike
      # IP geolocation, which is paid-for-HTTPS and geolocates the NAT gateway.
      - name: Probe Azure IMDS for the runner region
        continue-on-error: true
        run: |
          echo "--- IMDS ---"
          curl -s -m 5 -H 'Metadata:true' --noproxy '*' \
            "http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01" \
            | head -c 600 || echo "IMDS unreachable"
          echo
          echo "--- egress IP (what geolocation would see) ---"
          curl -s -m 5 https://api.ipify.org || echo "no egress lookup"
          echo
      # TRIAL: measuring this job's own energy. Pinned to the PR branch
      # because nothing is released yet. Its post step runs at job end.
      - uses: fabiocicerchia/carbon-badge/record@feat/self-reported-measurement
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # TRIAL: measuring this job's own energy. Pinned to the PR branch
      # because nothing is released yet. Its post step runs at job end.
      - uses: fabiocicerchia/carbon-badge/record@feat/self-reported-measurement
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      # TRIAL: measuring this job's own energy. Pinned to the PR branch
      # because nothing is released yet. Its post step runs at job end.
      - uses: fabiocicerchia/carbon-badge/record@feat/self-reported-measurement
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Check metadata
        run: pip install twine && twine check dist/*
