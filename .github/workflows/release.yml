name: Release

# release-please reads Conventional Commit messages on `main` and maintains an
# open "chore: release X.Y.Z" PR that bumps `version` in pyproject.toml and
# updates CHANGELOG.md. Merging that PR creates the vX.Y.Z tag + GitHub Release;
# this workflow then builds the sdist/wheel and (opt-in) publishes to PyPI.
#
# PyPI publishing is opt-in: configure a Trusted Publisher for this repository
# on pypi.org (workflow: release.yml, environment: pypi) and set the repository
# variable PUBLISH_TO_PYPI to "true".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag & release
      pull-requests: write  # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        id: release
        with:
          release-type: python

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach built artifacts to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
